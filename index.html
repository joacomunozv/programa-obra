<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa de Obra</title>
<meta name="description" content="Programación de obra tipo MS Project: Gantt, ruta crítica, línea base y avance">
<meta name="theme-color" content="#1f5f45">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f8f9fb; --line:#e2e5ea; --line2:#eef0f3;
  --text:#1c2230; --muted:#6b7280; --accent:#1f5f45; --accent2:#2f7d5c; --accent-soft:#e3f1ea;
  --bar:#5b8fd1; --bar-prog:#24497e; --crit:#d6453b; --crit-prog:#8c1f18;
  --sum:#2b2f36; --base:#b9c0cb; --sel:#e4eefb; --sel-line:#9dbbe6;
  --today:#e39a14; --corte:#7c3aed; --weekend:rgba(20,30,50,.045); --hol:rgba(214,69,59,.08);
  --warn:#c77700; --ok:#1f8a4c; --shadow:0 8px 30px rgba(15,23,42,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1b1f26; --panel2:#20252d; --line:#2e343e; --line2:#262b33;
    --text:#e6e9ee; --muted:#9aa3af; --accent:#4fb487; --accent2:#3d9a72; --accent-soft:#1f3a2e;
    --bar:#5d8fd0; --bar-prog:#a9c6ef; --crit:#e2645a; --crit-prog:#ffb3ad;
    --sum:#d9dde4; --base:#59616d; --sel:#243246; --sel-line:#3f5c85;
    --weekend:rgba(255,255,255,.035); --hol:rgba(226,100,90,.12); --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1b1f26; --panel2:#20252d; --line:#2e343e; --line2:#262b33;
  --text:#e6e9ee; --muted:#9aa3af; --accent:#4fb487; --accent2:#3d9a72; --accent-soft:#1f3a2e;
  --bar:#5d8fd0; --bar-prog:#a9c6ef; --crit:#e2645a; --crit-prog:#ffb3ad;
  --sum:#d9dde4; --base:#59616d; --sel:#243246; --sel-line:#3f5c85;
  --weekend:rgba(255,255,255,.035); --hol:rgba(226,100,90,.12); --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent);color:#fff;flex:none}
#top .brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
#top select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 8px;max-width:280px}
#top select option{color:#111}
#top .sp{flex:1}
#top .tb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:6px;padding:4px 10px;white-space:nowrap}
#top .tb:hover{background:rgba(255,255,255,.22)}
#top .tb.primary{background:#fff;color:var(--accent);font-weight:600;border-color:#fff}
#saveState{font-size:12px;opacity:.9;white-space:nowrap}
#saveState.dirty{color:#ffe08a;font-weight:600}
/* ---------- ribbon ---------- */
#ribbon{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.grp{display:flex;gap:4px;align-items:center;padding-right:14px;border-right:1px solid var(--line2)}
.grp:last-child{border-right:0}
.rb{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.rb:hover{background:var(--panel2);border-color:var(--line)}
.rb.on{background:var(--accent-soft);border-color:var(--accent2);color:var(--accent)}
.rb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb[disabled]{opacity:.4;pointer-events:none}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;min-width:0}
.inp:focus{outline:2px solid var(--sel-line);outline-offset:-1px}
#tabs{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.tab{border:0;background:transparent;padding:7px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
/* ---------- main ---------- */
#main{flex:1;min-height:0;display:flex;position:relative}
#split{flex:1;display:flex;min-width:0}
#lwrap{overflow:auto;background:var(--panel);flex:none;width:720px;min-width:200px;position:relative}
#splitter{width:6px;cursor:col-resize;background:var(--line);flex:none}
#splitter:hover{background:var(--sel-line)}
#gwrap{flex:1;overflow:auto;background:var(--panel);position:relative;min-width:0}
:root{--rh:26px;--hh:46px}
.lhead{position:sticky;top:0;z-index:3;display:grid;background:var(--panel2);border-bottom:1px solid var(--line);height:var(--hh);align-items:end}
.lhead .h{padding:4px 6px;font-weight:600;font-size:11.5px;color:var(--muted);border-right:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:100%;display:flex;align-items:flex-end}
.row{display:grid;height:var(--rh);border-bottom:1px solid var(--line2);cursor:default}
.row .c{font-size:12.5px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:var(--rh);border-right:1px solid var(--line2);font-variant-numeric:tabular-nums}
.row .c.r{text-align:right}
.row.sum{font-weight:650;background:var(--panel2)}
.row.sel{background:var(--sel)}
.row.crit .c.nm{color:var(--crit)}
.row .c.id{color:var(--muted);text-align:right;font-size:12px}
.row .c.ed{cursor:text}
.caret{display:inline-block;width:14px;text-align:center;cursor:pointer;color:var(--muted);user-select:none}
.ind{font-size:11px;text-align:center}
.ind .w{color:var(--warn)}
.c input,.c select{width:100%;height:calc(var(--rh) - 4px);border:1px solid var(--sel-line);border-radius:3px;padding:0 4px;background:var(--panel)}
.est{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--line2)}
.est.late{background:rgba(214,69,59,.14);color:var(--crit)}
.est.run{background:rgba(91,143,209,.16);color:var(--bar-prog)}
.est.done{background:rgba(31,138,76,.14);color:var(--ok)}
.neg{color:var(--crit);font-weight:600}
/* ---------- gantt ---------- */
.ghead{position:sticky;top:0;z-index:3;background:var(--panel2);border-bottom:1px solid var(--line);height:var(--hh)}
.tier{position:relative;height:50%;border-bottom:1px solid var(--line2);overflow:hidden}
.tier div{position:absolute;top:0;height:100%;border-left:1px solid var(--line);padding:3px 4px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.gbody{position:relative}
.gbg{position:absolute;inset:0;pointer-events:none}
.hol{position:absolute;top:0;bottom:0;background:var(--hol)}
.vline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--today);z-index:2}
.vline.corte{border-left-color:var(--corte)}
.grow{position:absolute;left:0;right:0;height:var(--rh);border-bottom:1px solid var(--line2)}
.grow.sel{background:var(--sel)}
.bar{position:absolute;height:14px;border-radius:3px;background:var(--bar);z-index:1;cursor:grab;touch-action:none}
.bar .pg{position:absolute;left:0;top:5px;height:4px;background:var(--bar-prog);border-radius:2px}
.bar.crit{background:var(--crit)}
.bar.crit .pg{background:var(--crit-prog)}
.bar .rs{position:absolute;right:-3px;top:0;width:8px;height:100%;cursor:ew-resize}
.bar .lk{position:absolute;right:-12px;top:3px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);background:var(--panel);opacity:0;cursor:crosshair}
.bar:hover .lk{opacity:1}
.bar.sum{height:7px;background:var(--sum);border-radius:0;cursor:default}
.bar.sum:before,.bar.sum:after{content:"";position:absolute;bottom:-5px;border:5px solid transparent;border-top:5px solid var(--sum)}
.bar.sum:before{left:-5px}.bar.sum:after{right:-5px}
.bar.ms{width:13px!important;height:13px;background:var(--sum);transform:rotate(45deg);border-radius:2px}
.bar.ms.crit{background:var(--crit)}
.bl{position:absolute;height:4px;background:var(--base);border-radius:2px}
.blbl{position:absolute;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none}
#garrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
#garrows path{fill:none;stroke:var(--muted);stroke-width:1.1}
#garrows path.crit{stroke:var(--crit)}
#tmpLink{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible}
/* ---------- status bar ---------- */
#status{flex:none;display:flex;gap:16px;padding:5px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
#status b{color:var(--text);font-weight:600}
/* ---------- views ---------- */
#view{flex:1;overflow:auto;padding:16px 20px;display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:0;background:var(--panel)}
table.t td{border-bottom:1px solid var(--line2);padding:5px 8px;font-variant-numeric:tabular-nums}
table.t tr.g td{background:var(--panel2);font-weight:650}
.heat{display:inline-block;min-width:22px;text-align:center;border-radius:3px;font-size:11px}
/* ---------- drawer / modal ---------- */
#drawer{position:absolute;right:0;top:0;bottom:0;width:400px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;display:none;flex-direction:column}
#drawer.open{display:flex}
#drawer header{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
#drawer header b{flex:1}
#drawer .body{padding:12px 14px;overflow:auto;flex:1}
#drawer footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.f label{font-size:11.5px;color:var(--muted);font-weight:600}
.f .inp{width:100%}
a{color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
.btn:hover{background:var(--panel2)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.dan{color:var(--crit)}
.x{border:0;background:transparent;font-size:18px;line-height:1;color:var(--muted);padding:2px 6px}
#modalBg{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBg.open{display:flex}
#modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:560px;max-width:100%;max-height:90vh;display:flex;flex-direction:column}
#modal header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:650;display:flex;align-items:center}
#modal header span{flex:1}
#modal .body{padding:14px 16px;overflow:auto}
#modal footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.sheetrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.pill{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--line2);color:var(--muted)}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--sum);color:var(--panel);padding:8px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.empty{max-width:520px;margin:10vh auto;text-align:center}
.empty h2{margin:0 0 8px}
.empty .btn{margin:6px}
body.ro .edit-only{display:none!important}
.admin-only{display:none!important}
body.isadmin .admin-only{display:inline-flex!important}
#whoami{font-size:12px;opacity:.9;white-space:nowrap}
.ubadge{font-size:11px;padding:1px 8px;border-radius:9px;background:var(--line2)}
.ubadge.admin{background:var(--accent-soft);color:var(--accent)}
.ubadge.off{background:rgba(214,69,59,.12);color:var(--crit)}
.lgd{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px;color:var(--muted)}
.lgd i{display:inline-block;width:18px;height:8px;border-radius:2px}
@media (max-width:760px){
  #top{flex-wrap:wrap;gap:6px}
  #top .sp{display:none}
  #ribbon{flex-wrap:nowrap;overflow-x:auto}
  #tabs{overflow-x:auto}
  .tab{white-space:nowrap}
  #lwrap{width:56vw}
  #ribbon .grp{padding-right:6px}
  .hide-m{display:none}
}
@media print{
  #top,#ribbon,#tabs,#status,.noprint{display:none!important}
  body{overflow:visible;height:auto;background:#fff}
  #main,#view{overflow:visible;display:block}
  .card{border:0;padding:0}
}
</style>
</head>
<body>
<div id="top">
  <span class="brand">▦ Programa de Obra</span>
  <select id="projSel" title="Proyecto"></select>
  <button class="tb hide-m edit-only" id="btnNewProj">Nuevo</button>
  <button class="tb hide-m edit-only" id="btnProjMenu">Proyecto ▾</button>
  <span class="sp"></span>
  <span id="saveState"></span>
  <span id="whoami"></span>
  <button class="tb admin-only" id="btnUsers">Usuarios</button>
  <button class="tb edit-only" id="btnImport">Importar</button>
  <button class="tb hide-m" id="btnExport">Exportar ▾</button>
  <button class="tb primary edit-only" id="btnSave" title="Ctrl+S">Guardar</button>
  <button class="tb" id="btnCfg" title="Configuración">⚙</button>
</div>

<div id="ribbon">
  <div class="grp edit-only">
    <button class="rb" id="bUndo" title="Deshacer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="rb" id="bRedo" title="Rehacer (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>
  <div class="grp edit-only">
    <button class="rb" id="bAdd" title="Nueva tarea (Insert)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tarea</button>
    <button class="rb" id="bMs" title="Nuevo hito"><svg viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9z"/></svg>Hito</button>
    <button class="rb" id="bDel" title="Eliminar (Supr)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button class="rb" id="bOut" title="Quitar sangría (Alt+Shift+←)"><svg viewBox="0 0 24 24"><path d="M11 6 5 12l6 6M19 12H5"/></svg></button>
    <button class="rb" id="bIn" title="Aplicar sangría (Alt+Shift+→)"><svg viewBox="0 0 24 24"><path d="m13 6 6 6-6 6M5 12h14"/></svg></button>
    <button class="rb" id="bUp" title="Subir"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    <button class="rb" id="bDown" title="Bajar"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
  </div>
  <div class="grp edit-only">
    <button class="rb" id="bLink" title="Vincular seleccionadas FC (Ctrl+F2)"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Vincular</button>
    <button class="rb" id="bUnlink" title="Desvincular seleccionadas"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7M4 4l16 16"/></svg></button>
    <button class="rb" id="bInfo" title="Información de la tarea (Shift+F2)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Info</button>
  </div>
  <div class="grp hide-m edit-only">
    <span class="small muted">Avance</span>
    <button class="rb" data-pct="0">0%</button><button class="rb" data-pct="25">25</button><button class="rb" data-pct="50">50</button><button class="rb" data-pct="75">75</button><button class="rb" data-pct="100">100%</button>
  </div>
  <div class="grp">
    <button class="rb" id="bZoomOut" title="Alejar">−</button>
    <select class="inp" id="zoomSel" title="Escala de tiempo (Ctrl + rueda sobre el Gantt para zoom libre)"><option value="dia">Día</option><option value="semana" selected>Semana</option><option value="mes">Mes</option><option value="trim">Trimestre</option><option value="fit">Ajustar a pantalla</option><option value="custom" hidden>Personalizado</option></select>
    <button class="rb" id="bZoomIn" title="Acercar">+</button>
    <button class="rb" id="bToday" title="Ir a hoy">Hoy</button>
    <button class="rb" id="bCrit" title="Resaltar ruta crítica">Ruta crítica</button>
    <button class="rb" id="bBase" title="Mostrar línea base">Línea base</button>
  </div>
  <div class="grp" title="Tamaño de la vista (Ctrl + rueda sobre la tabla)">
    <span class="small muted">Tamaño</span>
    <button class="rb" id="bUiOut">−</button><button class="rb" id="bUiReset" style="min-width:46px;justify-content:center">100%</button><button class="rb" id="bUiIn">+</button>
  </div>
  <div class="grp">
    <input class="inp" id="fText" placeholder="Buscar…" style="width:130px">
    <select class="inp" id="fPiso"><option value="">Todos los pisos</option></select>
    <select class="inp" id="fSub"><option value="">Todos los subcontratos</option></select>
    <select class="inp" id="fEst">
      <option value="">Todas</option><option value="crit">Ruta crítica</option><option value="late">Atrasadas</option>
      <option value="run">En curso</option><option value="next3">Próximas 3 semanas</option><option value="todo">Por iniciar</option>
      <option value="done">Terminadas</option><option value="unsch">Sin programar</option><option value="warn">Con advertencias</option>
    </select>
  </div>
</div>

<div id="tabs">
  <button class="tab on" data-v="gantt">Diagrama de Gantt</button>
  <button class="tab" data-v="look">Look-ahead</button>
  <button class="tab" data-v="subs">Subcontratos</button>
  <button class="tab" data-v="avance">Avance / Curva S</button>
  <button class="tab" data-v="cal">Calendario y proyecto</button>
</div>

<div id="main">
  <div id="split">
    <div id="lwrap"><div class="lhead" id="lhead"></div><div id="lbody"></div></div>
    <div id="splitter"></div>
    <div id="gwrap"><div class="ghead" id="ghead"></div><div class="gbody" id="gbody"></div></div>
  </div>
  <div id="view"></div>
  <aside id="drawer"></aside>
</div>
<div id="status"></div>
<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".xlsx,.xlsm,.xls,.xml,.json" hidden>

<script>
'use strict';
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 864e5;
const dn = s => { if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; return Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY); };
const isoOf = n => new Date(n * DAY).toISOString().slice(0, 10);
const fmt = s => s ? s.slice(8, 10) + '-' + s.slice(5, 7) + '-' + s.slice(2, 4) : '';

/* =====================================================================
   CALENDARIO LABORAL (lun-vie + sábado opcional, menos feriados)
   Índices de "día hábil": idx -> fecha. ES/EF de CPM se manejan en índices.
   ===================================================================== */
const Cal = {
  B: dn('2018-01-01'), N: 365 * 22,
  build(feriados, sat) {
    const N = this.N, B = this.B;
    this.hol = new Set((feriados || []).map(f => dn(f.fecha)).filter(x => x != null));
    this.work = new Uint8Array(N); this.fl = new Int32Array(N); this.ce = new Int32Array(N); this.days = [];
    for (let i = 0; i < N; i++) {
      const d = B + i, w = dowOf(d);
      const ok = w !== 0 && (w !== 6 || sat) && !this.hol.has(d);
      this.work[i] = ok ? 1 : 0; if (ok) this.days.push(d);
      this.fl[i] = this.days.length - 1;
    }
    let next = this.days.length - 1;
    for (let i = N - 1; i >= 0; i--) { if (this.work[i]) next = this.fl[i]; this.ce[i] = next; }
    this.sat = !!sat;
  },
  _i(d) { return clamp(d - this.B, 0, this.N - 1); },
  isWork(d) { const i = d - this.B; return i >= 0 && i < this.N && this.work[i] === 1; },
  ci(d) { return this.ce[this._i(d)]; },            // 1er día hábil >= d
  fi(d) { return Math.max(0, this.fl[this._i(d)]); }, // último día hábil <= d
  day(idx) { return this.days[clamp(idx, 0, this.days.length - 1)]; },
  iso(idx) { return isoOf(this.day(idx)); },
  count(a, b) { return this.fi(b) - this.ci(a) + 1; },
};

const S = {

  projects: [], project: null, tasks: [], feriados: [],
  dirty: false, undo: [], redo: [],

  vis: [], byUid: new Map(), stats: {},

const ZOOM = { dia: 26, semana: 8, mes: 2.6, trim: 0.9 };
const CT = { ASAP: 'Lo antes posible', SNET: 'No comenzar antes de', SNLT: 'No comenzar después de', FNET: 'No terminar antes de', FNLT: 'No terminar después de', MSO: 'Debe comenzar el', MFO: 'Debe finalizar el' };
const CT_FROM_TXT = Object.fromEntries(Object.entries(CT).map(([k, v]) => [v.toLowerCase(), k]));
const LT_ES = { FS: 'FC', SS: 'CC', FF: 'FF', SF: 'CF' };
const LT_IN = { FC: 'FS', CC: 'SS', FF: 'FF', CF: 'SF', FS: 'FS', SS: 'SS', SF: 'SF' };

/* =====================================================================
   PREDECESORAS: "12;15CC+2d;20FF-1"  (acepta FC/CC/FF/CF y FS/SS/FF/SF)
   ===================================================================== */
function parsePreds(txt) {
  const out = [], bad = [];
  String(txt || '').split(/[;,]/).map(s => s.trim()).filter(s => s && s !== '—' && s !== '-').forEach(s => {
    const m = s.match(/^(\d+)\s*(FC|CC|FF|CF|FS|SS|SF)?\s*(?:([+-])\s*(\d+(?:[.,]\d+)?)\s*(d|día|días|dias|dia|day|days|s|sem|semanas?|w|wk)?)?$/i);
    if (!m) { bad.push(s); return; }
    let lag = m[4] ? parseFloat(m[4].replace(',', '.')) : 0;
    if (m[5] && /^(s|sem|semana|semanas|w|wk)$/i.test(m[5])) lag *= Cal.sat ? 6 : 5;
    if (m[3] === '-') lag = -lag;
    out.push({ u: +m[1], t: LT_IN[(m[2] || 'FS').toUpperCase()], l: Math.round(lag) });
  });
  return { preds: out, bad };
}
const predsText = ps => (ps || []).map(p => p.u + (p.t !== 'FS' ? LT_ES[p.t] : '') + (p.l ? (p.l > 0 ? '+' : '') + p.l + 'd' : '')).join(';');

/* =====================================================================
   MOTOR DE PROGRAMACIÓN (CPM)
   Tarea hoja: ES (índice hábil de inicio), EF = ES + dur (exclusivo).
   ===================================================================== */
function schedule() {
  const T = S.tasks;
  Cal.build(S.feriados, S.project?.config?.sat);
  // --- jerarquía ---
  const stack = [];
  T.forEach((t, i) => {
    t._i = i; t._ch = []; t._par = null; t._warn = '';
    if (!t.nivel || t.nivel < 1) t.nivel = 1;
    while (stack.length && stack[stack.length - 1].nivel >= t.nivel) stack.pop();
    if (stack.length) { const p = stack[stack.length - 1]; if (t.nivel > p.nivel + 1) t.nivel = p.nivel + 1; t._par = p; p._ch.push(t); }
    else t.nivel = 1;
    stack.push(t);
  });
  const cnt = [];
  T.forEach(t => {
    t._sum = t._ch.length > 0;
    cnt.length = t.nivel; cnt[t.nivel - 1] = (cnt[t.nivel - 1] || 0) + 1;
    t._wbs = cnt.slice(0, t.nivel).map(x => x || 1).join('.');
  });
  const byUid = new Map(T.map(t => [t.uid, t])); S.byUid = byUid;
  const leaves = T.filter(t => !t._sum && t.dur != null && t.dur !== '');
  T.forEach(t => { t._succ = []; t._pl = []; t._ES = t._EF = t._LS = t._LF = t._TF = null; t._crit = false; });
  leaves.forEach(t => (t.preds || []).forEach(p => {
    const q = byUid.get(p.u);
    if (!q || q === t) { t._warn = 'Predecesora inexistente: ' + p.u; return; }
    if (q._sum) { t._warn = 'Vínculo a tarea resumen (' + p.u + ') no considerado'; return; }
    if (q.dur == null || q.dur === '') { t._warn = 'Predecesora sin programar (' + p.u + ')'; return; }
    t._pl.push({ q, p }); q._succ.push({ t, p });
  }));
  // --- orden topológico ---
  const indeg = new Map(leaves.map(t => [t, t._pl.length]));
  const queue = leaves.filter(t => indeg.get(t) === 0), order = [];
  while (queue.length) {
    const t = queue.shift(); order.push(t);
    t._succ.forEach(({ t: s }) => { indeg.set(s, indeg.get(s) - 1); if (indeg.get(s) === 0) queue.push(s); });
  }
  if (order.length < leaves.length) {
    const inOrder = new Set(order);
    leaves.filter(t => !inOrder.has(t)).forEach(t => { t._warn = 'Dependencia circular'; order.push(t); });
  }
  const P0 = Cal.ci(dn(S.project.inicio) ?? dn(todayIso()));
  // --- pasada hacia adelante ---
  order.forEach(t => {
    // Hitos (dur 0): convención "fin de día" -> el hito en la fecha D tiene ES = índice(D)+1
    const d = Math.max(0, Math.round(+t.dur)); let s = P0;
    t._pl.forEach(({ q, p }) => {
      if (q._ES == null) return;
      const l = p.l || 0; let b;
      if (p.t === 'SS') b = q._ES + l; else if (p.t === 'FF') b = q._EF + l - d; else if (p.t === 'SF') b = q._ES + l - d; else b = q._EF + l;
      if (b > s) s = b;
    });
    const cd = dn(t.cd);
    if (cd != null) {
      const fEnd = Cal.fi(cd) + 1 - d;                  // terminar el día cd
      if (t.ct === 'SNET') s = Math.max(s, d === 0 ? fEnd : Cal.ci(cd));
      else if (t.ct === 'FNET') s = Math.max(s, fEnd);
      else if (t.ct === 'MSO') s = d === 0 ? fEnd : Cal.ci(cd);
      else if (t.ct === 'MFO') s = fEnd;
    }
    t._ES = s; t._EF = s + d;
  });
  let PE = P0; leaves.forEach(t => { if (t._EF != null && t._EF > PE) PE = t._EF; });
  // --- pasada hacia atrás ---
  for (let k = order.length - 1; k >= 0; k--) {
    const t = order[k], d = t._EF - t._ES; let lf = PE;
    t._succ.forEach(({ t: s, p }) => {
      if (s._LS == null) return;
      const l = p.l || 0; let b;
      if (p.t === 'SS') b = s._LS - l + d; else if (p.t === 'FF') b = s._LF - l; else if (p.t === 'SF') b = s._LF - l + d; else b = s._LS - l;
      if (b < lf) lf = b;
    });
    const cd = dn(t.cd);
    if (cd != null) {
      if (t.ct === 'FNLT') lf = Math.min(lf, Cal.fi(cd) + 1);
      else if (t.ct === 'SNLT') lf = Math.min(lf, d === 0 ? Cal.fi(cd) + 1 : Cal.ci(cd) + d);

    t._crit = t._TF <= 0 && (+t.avance || 0) < 1;
  }
  // --- fechas y estado al corte ---
  const C = Cal.fi(dn(S.project.fecha_corte || todayIso())) + 1;
  leaves.forEach(t => {
    const d = t._EF - t._ES;
    t.start = d > 0 ? Cal.iso(t._ES) : Cal.iso(Math.max(P0, t._ES - 1));
    t.finish = d > 0 ? Cal.iso(t._EF - 1) : t.start;
    t._prog = d > 0 ? clamp((C - t._ES) / d, 0, 1) : (C >= t._ES ? 1 : 0);
  });
  T.forEach(t => { if (!t._sum && (t.dur == null || t.dur === '')) { t.start = ''; t.finish = ''; t._prog = 0; } });
  // --- resúmenes (de abajo hacia arriba) ---
  for (let i = T.length - 1; i >= 0; i--) {
    const t = T[i]; if (!t._sum) continue;
    const ks = t._ch.filter(k => k._ES != null);
    if (!ks.length) { t.start = t.finish = ''; t._ES = null; t.avance = 0; t._prog = 0; continue; }
    t._ES = Math.min(...ks.map(k => k._ES)); t._EF = Math.max(...ks.map(k => k._EF));
    t.start = ks.map(k => k.start).sort()[0]; t.finish = ks.map(k => k.finish).sort().pop();
    let w = 0, a = 0, pr = 0;
    ks.forEach(k => { const kw = Math.max(1, k._sum ? k._wdur : (k._EF - k._ES)); w += kw; a += kw * (+k.avance || 0); pr += kw * (k._prog || 0); });
    t._wdur = w; t.avance = w ? a / w : 0; t._prog = w ? pr / w : 0;
    t._TF = Math.min(...ks.map(k => k._TF ?? 1e9)); t._crit = ks.some(k => k._crit);
    t.dur = Cal.count(dn(t.start), dn(t.finish));
  }
  // --- estado ---
  T.forEach(t => {
    const a = +t.avance || 0, p = t._prog || 0;
    if (!t.start) t._est = 'Sin programar';
    else if (a >= 0.999) t._est = 'Terminada';
    else if (p >= 1) t._est = 'Debió terminar';
    else if (p > 0 && a === 0) t._est = 'Debió iniciar';
    else if (a > 0) t._est = a + 0.1 < p ? 'Atrasada' : 'En curso';
    else t._est = 'Por iniciar';

  });

  const L = T.filter(t => !t._sum && t.start);
  let w = 0, a = 0, pr = 0;
  L.forEach(t => { const kw = Math.max(1, t._EF - t._ES); w += kw; a += kw * (+t.avance || 0); pr += kw * (t._prog || 0); });
  S.stats = {
    n: T.filter(t => !t._sum).length, start: L.map(t => t.start).sort()[0] || '', finish: L.map(t => t.finish).sort().pop() || '',
    real: w ? a / w : 0, prog: w ? pr / w : 0, crit: L.filter(t => t._crit).length, late: L.filter(t => t._late).length,
    unsch: T.filter(t => !t._sum && !t.start).length, warn: T.filter(t => t._warn).length,
  };
}

/* =====================================================================
   VISIBILIDAD (colapsar + filtros)
   ===================================================================== */
function computeVisible() {
  const f = { text: $('#fText').value.trim().toLowerCase(), piso: $('#fPiso').value, sub: $('#fSub').value, est: $('#fEst').value };
  const active = f.text || f.piso || f.sub || f.est;
  const C = dn(S.project?.fecha_corte || todayIso()), C21 = C + 21;
  const match = t => {
    if (t._sum) return false;
    if (f.text && !(String(t.nombre).toLowerCase().includes(f.text) || String(t.uid) === f.text || String(t.notas || '').toLowerCase().includes(f.text))) return false;
    if (f.piso && String(t.piso) !== f.piso) return false;
    if (f.sub && (t.sub || '') !== f.sub) return false;
    switch (f.est) {
      case 'crit': return t._crit;
      case 'late': return t._late;
      case 'run': return t._est === 'En curso' || t._est === 'Atrasada';
      case 'todo': return t._est === 'Por iniciar';
      case 'done': return t._est === 'Terminada';
      case 'unsch': return !t.start;
      case 'warn': return !!t._warn;
      case 'next3': return t.start && (+t.avance || 0) < 1 && dn(t.start) <= C21 && dn(t.finish) >= C;
    }
    return true;
  };
  let vis;
  if (active) {
    const keep = new Set();
    S.tasks.forEach(t => { if (match(t)) { keep.add(t); let p = t._par; while (p) { keep.add(p); p = p._par; } } });
    vis = S.tasks.filter(t => keep.has(t));
  } else {
    vis = []; let hideBelow = Infinity;
    S.tasks.forEach(t => {
      if (t.nivel > hideBelow) return;
      hideBelow = Infinity; vis.push(t);
      if (t._sum && S.collapsed.has(t.uid)) hideBelow = t.nivel;
    });
  }
  S.vis = vis; S.filterActive = !!active;
}

   GANTT (panel derecho)
   ===================================================================== */
const G = { t0: 0, t1: 0, ppd: 8, RH: 26 };
/* Tamaño de la vista: escala toda el área de trabajo (tabla, Gantt y pestañas) con CSS zoom. */
const uiZ = () => S.ui || 1;
function setUi(z) {
  S.ui = Math.round(clamp(z, 0.5, 1.5) * 10) / 10; LS.set('po_ui', S.ui);
  ['#split', '#view', '#drawer'].forEach(sel => { $(sel).style.zoom = S.ui; });
  $('#bUiReset').textContent = Math.round(S.ui * 100) + '%';

/** Píxeles por día según la escala elegida (fija, ajustada al proyecto o libre con Ctrl+rueda). */
function ganttPpd(spanDays) {
  if (S.zoom === 'fit') { const w = ($('#gwrap').clientWidth || 900) - 16; return clamp(w / Math.max(30, spanDays), 0.25, 40); }
  if (S.zoom === 'custom') return clamp(S.ppdC || 8, 0.25, 40);

}
function renderGantt() {
  const RH = G.RH;

  const base = dn(S.project.inicio) || dn(todayIso());
  let a = starts.length ? Math.min(...starts, base) : base, b = ends.length ? Math.max(...ends) : base + 90;
  if (S.showBase) S.tasks.forEach(t => { if (t.bls) a = Math.min(a, dn(t.bls)); if (t.blf) b = Math.max(b, dn(t.blf)); });

  if (S.zoom !== 'fit') b += mode === 'dia' || mode === 'semana' ? 28 : 60;
  G.t0 = a; G.t1 = b; G.mode = mode;
  const W = (b - a + 1) * ppd, H = S.vis.length * RH + 40;
  const x = d => (d - a) * ppd;
  // ---- encabezado (2 niveles) ----
  let top = '', bot = '';
  const years = () => { for (let y = new Date(a * DAY).getUTCFullYear(); y <= new Date(b * DAY).getUTCFullYear(); y++) { const s0 = Math.max(a, dn(y + '-01-01')), e = Math.min(b, dn(y + '-12-31')); top += `<div style="left:${x(s0)}px;width:${(e - s0 + 1) * ppd}px">${y}</div>`; } };
  const months = (lbl) => { for (let d = a; d <= b;) { const dt = new Date(d * DAY), y = dt.getUTCFullYear(), m = dt.getUTCMonth(); const e = Math.min(b, Math.round(Date.UTC(y, m + 1, 1) / DAY) - 1); const w = (e - d + 1) * ppd; (lbl ? (top += `<div style="left:${x(d)}px;width:${w}px">${MESES[m]} ${y}</div>`) : (bot += `<div style="left:${x(d)}px;width:${w}px">${w > 26 ? MESES[m] : MESES[m][0]}</div>`)); d = e + 1; } };
  if (mode === 'trim') {
    years();
    for (let d = a; d <= b;) { const dt = new Date(d * DAY), y = dt.getUTCFullYear(), q = Math.floor(dt.getUTCMonth() / 3); const e = Math.min(b, Math.round(Date.UTC(y, q * 3 + 3, 1) / DAY) - 1); bot += `<div style="left:${x(d)}px;width:${(e - d + 1) * ppd}px">T${q + 1}</div>`; d = e + 1; }
  } else if (mode === 'mes') { years(); months(false); }
  else {
    months(true);
    if (mode === 'semana') for (let d = a; d <= b; d += 7) bot += `<div style="left:${x(d)}px;width:${7 * ppd}px">${ppd * 7 >= 34 ? isoOf(d).slice(8, 10) + '/' + isoOf(d).slice(5, 7) : isoOf(d).slice(8, 10)}</div>`;
    else for (let d = a; d <= b; d++) { const w = dowOf(d); bot += `<div style="left:${x(d)}px;width:${ppd}px;text-align:center;padding:3px 0;${w === 0 || w === 6 ? 'opacity:.55' : ''}">${'DLMXJVS'[w]}${isoOf(d).slice(8, 10)}</div>`; }
  }
  $('#ghead').style.width = W + 'px';
  $('#ghead').innerHTML = `<div class="tier">${top}</div><div class="tier">${bot}</div>`;
  // ---- fondo ----
  const sat = S.project.config?.sat;
  const wkStart = (sat ? 6 : 5) * ppd;
  let bg = (mode === 'dia' || mode === 'semana') ? `background:repeating-linear-gradient(90deg,transparent 0 ${wkStart}px,var(--weekend) ${wkStart}px ${7 * ppd}px)` : '';
  let hol = '';
  Cal.hol.forEach(d => { if (d >= a && d <= b && dowOf(d) !== 0) hol += `<div class="hol" style="left:${x(d)}px;width:${Math.max(ppd, 1.5)}px" title="Feriado ${fmtL(isoOf(d))}"></div>`; });
  const td = dn(todayIso()), cd = dn(S.project.fecha_corte);
  let lines = `<div class="vline" style="left:${x(td) + ppd / 2}px" title="Hoy"></div>`;
  if (cd && cd !== td) lines += `<div class="vline corte" style="left:${x(cd) + ppd}px" title="Fecha de corte ${fmtL(S.project.fecha_corte)}"></div>`;
  // ---- filas y barras ----
  let rows = '', bars = '';
  const rowOf = new Map();
  S.vis.forEach((t, i) => {
    rowOf.set(t.uid, i);
    const y = i * RH;
    rows += `<div class="grow ${S.sel.has(t.uid) ? 'sel' : ''}" data-u="${t.uid}" style="top:${y}px"></div>`;
    if (!t.start) return;
    const s = dn(t.start), e = dn(t.finish);
    const crit = S.showCrit && t._crit ? 'crit' : '';
    const tip = esc(`${t.uid} · ${t.nombre}\n${fmtL(t.start)} → ${fmtL(t.finish)} (${t.dur} d)\nAvance ${pct(t.avance)} · Holgura ${t._TF ?? '-'} d${t.sub ? '\n' + t.sub : ''}`);
    if (S.showBase && t.bls && t.blf && !t._sum) bars += `<div class="bl" style="left:${x(dn(t.bls))}px;width:${(dn(t.blf) - dn(t.bls) + 1) * ppd}px;top:${y + 19}px"></div>`;
    if (t._sum) {
      bars += `<div class="bar sum" data-u="${t.uid}" title="${tip}" style="left:${x(s)}px;width:${Math.max(2, (e - s + 1) * ppd)}px;top:${y + 7}px"></div>`;
    } else if (+t.dur === 0) {
      bars += `<div class="bar ms ${crit}" data-u="${t.uid}" title="${tip}" style="left:${x(s) + ppd / 2 - 6}px;top:${y + 6}px"></div>`;
      bars += `<div class="blbl" style="left:${x(s) + ppd / 2 + 12}px;top:${y + 5}px">${fmt(t.start)}</div>`;
    } else {
      const w = Math.max(3, (e - s + 1) * ppd);
      bars += `<div class="bar ${crit}" data-u="${t.uid}" title="${tip}" style="left:${x(s)}px;width:${w}px;top:${y + 6}px"><div class="pg" style="width:${(+t.avance || 0) * 100}%"></div><div class="rs"></div><div class="lk"></div></div>`;
      if (t.sub) bars += `<div class="blbl" style="left:${x(s) + w + 14}px;top:${y + 5}px">${esc(t.sub)}</div>`;
    }
  });
  // ---- flechas ----
  let paths = '';
  if (S.vis.length < 2500) S.vis.forEach(t => {
    if (t._sum || !t.start) return;
    (t._pl || []).forEach(({ q, p }) => {
      if (!rowOf.has(q.uid) || !q.start) return;
      const r1 = rowOf.get(q.uid), r2 = rowOf.get(t.uid);
      const fromEnd = p.t === 'FS' || p.t === 'FF', toEnd = p.t === 'FF' || p.t === 'SF';
      const msA = +q.dur === 0, msB = +t.dur === 0;
      const x1 = fromEnd ? x(dn(q.finish)) + (msA ? ppd / 2 + 6 : ppd) : x(dn(q.start)) + (msA ? ppd / 2 - 6 : 0);
      const x2 = toEnd ? x(dn(t.finish)) + (msB ? ppd / 2 + 6 : ppd) : x(dn(t.start)) + (msB ? ppd / 2 - 6 : 0);
      const y1 = r1 * RH + 13, y2 = r2 * RH + 13, dir = y2 > y1 ? 1 : -1;
      const out = fromEnd ? 6 : -6, inn = toEnd ? 6 : -6;
      const d = (!toEnd && x2 >= x1 + out + 4)
        ? `M${x1},${y1}H${x2 + 3}V${y2 - dir * 7}`
        : `M${x1},${y1}h${out}V${y1 + dir * RH / 2}H${x2 + inn}V${y2}H${x2}`;
      const crit = S.showCrit && t._crit && q._crit ? 'crit' : '';
      paths += `<path class="${crit}" d="${d}" marker-end="url(#ah${crit ? 'c' : ''})"/>`;
    });
  });
  const defs = `<defs><marker id="ah" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L6,3L0,6z" fill="var(--muted)" stroke="none"/></marker><marker id="ahc" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L6,3L0,6z" fill="var(--crit)" stroke="none"/></marker></defs>`;
  const body = $('#gbody');
  body.style.width = W + 'px'; body.style.height = H + 'px';
  body.innerHTML = `<div class="gbg" style="${bg}">${hol}</div>${rows}${lines}<svg id="garrows" width="${W}" height="${H}">${defs}${paths}</svg>${bars}<svg id="tmpLink" width="${W}" height="${H}"></svg>`;
}

}
function renderStatus() {

    <span>Corte <b>${fmtL(S.project.fecha_corte || todayIso())}</b></span><span>Avance real <b>${pct(s.real)}</b></span><span>Programado <b>${pct(s.prog)}</b></span>

    <span class="hide-m">${S.filterActive ? 'Filtro activo · ' + S.vis.filter(t => !t._sum).length + ' visibles' : ''}</span>` : '';

function renderAll() {

  else { $('#split').style.display = 'none'; $('#view').style.display = 'block'; renderView(); }

function renderSaveState() {

    <p class="small muted" style="margin-top:20px">${Store.remote() ? 'Conectado al servidor (Google Sheets).' : 'Modo local. Para trabajar en línea con el equipo, abre el link personal que te envió el administrador.'}</p></div>`;

/* =====================================================================
   HISTORIAL (deshacer / rehacer)
   ===================================================================== */
const PERSIST = ['uid', 'nivel', 'nombre', 'piso', 'sub', 'dur', 'avance', 'preds', 'ct', 'cd', 'bls', 'blf', 'bld', 'notas', 'start', 'finish'];
const clean = t => { const o = {}; PERSIST.forEach(k => { o[k] = t[k]; }); return o; };
const snapshot = () => JSON.stringify({ tasks: S.tasks.map(clean), project: S.project });
function snap() { if (!canEdit()) { toast('Tu acceso es de solo lectura'); throw new Error('RO'); } S.undo.push(snapshot()); if (S.undo.length > 60) S.undo.shift(); S.redo = []; }
function restore(json) { const o = JSON.parse(json); S.tasks = o.tasks; S.project = o.project; }
function undo() { if (!S.undo.length) return; S.redo.push(snapshot()); restore(S.undo.pop()); markDirty(); recalc(); }
function redo() { if (!S.redo.length) return; S.undo.push(snapshot()); restore(S.redo.pop()); markDirty(); recalc(); }
function markDirty() { S.dirty = true; renderSaveState(); if (!Store.remote()) autosaveLocal(); }
let _asT; function autosaveLocal() { clearTimeout(_asT); _asT = setTimeout(() => saveProject(true), 800); }

/* =====================================================================
   EDICIÓN
   ===================================================================== */
function parseDur(v) {
  const s = String(v).trim().toLowerCase().replace(',', '.');
  if (s === '' || s === '—' || s === '-') return null;
  const m = s.match(/^(\d+(?:\.\d+)?)\s*(d|día|días|dias|dia|s|sem|semanas?|m|mes|meses)?\??$/);
  if (!m) return undefined;
  let n = parseFloat(m[1]);
  if (m[2] && /^s|^sem/.test(m[2])) n *= Cal.sat ? 6 : 5;
  if (m[2] && /^m/.test(m[2])) n *= Cal.sat ? 26 : 22;
  return Math.round(n);
}
function setField(t, f, v) {
  switch (f) {
    case 'nombre': t.nombre = String(v).trim() || t.nombre; break;
    case 'piso': t.piso = String(v).trim(); break;
    case 'sub': t.sub = String(v).trim().toUpperCase(); break;
    case 'notas': t.notas = String(v); break;
    case 'dur': {
      const d = parseDur(v); if (d === undefined) { toast('Duración no válida (ej: 5, 5d, 2sem, 0 = hito)'); return false; }
      t.dur = d; break;
    }
    case 'start': {
      const s = anyToIso(v); if (!s) return false;
      if (t.dur == null || t.dur === '') t.dur = 1;
      if (t.ct !== 'MSO') t.ct = 'SNET'; t.cd = s; break;
    }
    case 'finish': {
      const s = anyToIso(v); if (!s) return false;
      if (t.dur == null || t.dur === '' || t._ES == null) { t.dur = 1; t.ct = 'SNET'; t.cd = s; break; }
      const nd = Cal.fi(dn(s)) - t._ES + 1; t.dur = Math.max(t.dur === 0 ? 0 : 1, nd); break;
    }
    case 'preds': {
      const r = parsePreds(v); if (r.bad.length) { toast('No entendí: ' + r.bad.join(', ') + '  (formato: 12;15CC+2d)'); return false; }
      const miss = r.preds.filter(p => !S.byUid.has(p.u) || p.u === t.uid);
      if (miss.length) { toast('ID inexistente: ' + miss.map(p => p.u).join(', ')); return false; }
      t.preds = r.preds; break;
    }
    case 'avance': {
      let n = parseFloat(String(v).replace('%', '').replace(',', '.')); if (isNaN(n)) return false;
      if (n > 1) n = n / 100; t.avance = clamp(n, 0, 1); break;
    }
    case 'ct': t.ct = v; if (v === 'ASAP') t.cd = ''; break;
    case 'cd': t.cd = anyToIso(v); break;
  }
  return true;
}
function selectedTasks() { return S.tasks.filter(t => S.sel.has(t.uid)); }
function nextUid() { return S.tasks.reduce((m, t) => Math.max(m, +t.uid || 0), 0) + 1; }
function newTask(ms) {
  snap();
  const sel = selectedTasks(); const ref = sel[sel.length - 1];
  let idx = S.tasks.length, nivel = 1;
  if (ref) {
    if (ref._sum && !S.collapsed.has(ref.uid)) { idx = ref._i + 1; nivel = ref.nivel + 1; }
    else { let j = ref._i + 1; while (j < S.tasks.length && S.tasks[j].nivel > ref.nivel) j++; idx = j; nivel = ref.nivel; }
  }
  const t = { uid: nextUid(), nivel, nombre: ms ? 'Nuevo hito' : 'Nueva tarea', piso: ref && !ref._sum ? ref.piso : '', sub: '', dur: ms ? 0 : 1, avance: 0, preds: [], ct: 'ASAP', cd: '', notas: '' };
  S.tasks.splice(idx, 0, t);
  S.sel = new Set([t.uid]); markDirty(); recalc();
  setTimeout(() => startEdit(t.uid, 'nombre'), 30);
}
function deleteSel() {
  const sel = selectedTasks(); if (!sel.length) return;
  const del = new Set();
  sel.forEach(t => { del.add(t.uid); if (t._sum) { let j = t._i + 1; while (j < S.tasks.length && S.tasks[j].nivel > t.nivel) { del.add(S.tasks[j].uid); j++; } } });
  if (del.size > 1 && !confirm(`¿Eliminar ${del.size} tareas?`)) return;
  snap();
  S.tasks = S.tasks.filter(t => !del.has(t.uid));
  S.tasks.forEach(t => { t.preds = (t.preds || []).filter(p => !del.has(p.u)); });
  S.sel.clear(); markDirty(); recalc();
}
function subtreeEnd(t) { let j = t._i + 1; while (j < S.tasks.length && S.tasks[j].nivel > t.nivel) j++; return j; }
function indent(dir) {
  const sel = selectedTasks(); if (!sel.length) return; snap();
  const done = new Set();
  sel.forEach(t => {
    if (done.has(t.uid)) return;
    const end = subtreeEnd(t), block = S.tasks.slice(t._i, end);
    if (dir > 0) { const prev = S.tasks[t._i - 1]; if (!prev || prev.nivel < t.nivel) return; }
    if (dir < 0 && t.nivel <= 1) return;
    block.forEach(b => { b.nivel += dir; done.add(b.uid); });
  });
  markDirty(); recalc();
}
function moveSel(dir) {
  const sel = selectedTasks(); if (sel.length !== 1) { toast('Selecciona una tarea para moverla'); return; }
  const t = sel[0], end = subtreeEnd(t), block = S.tasks.slice(t._i, end);
  snap();
  if (dir < 0) {
    let j = t._i - 1; while (j >= 0 && S.tasks[j].nivel > t.nivel) j--;
    if (j < 0 || S.tasks[j].nivel < t.nivel) { S.undo.pop(); return; }
    S.tasks.splice(t._i, block.length); S.tasks.splice(j, 0, ...block);
  } else {
    const nx = S.tasks[end]; if (!nx || nx.nivel < t.nivel) { S.undo.pop(); return; }
    const nend = subtreeEnd(nx); S.tasks.splice(t._i, block.length); S.tasks.splice(nend - block.length, 0, ...block);
  }
  markDirty(); recalc();
}
function linkSel() {
  const sel = selectedTasks().filter(t => !t._sum); if (sel.length < 2) { toast('Selecciona 2 o más tareas (Ctrl+clic)'); return; }
  snap();
  for (let i = 1; i < sel.length; i++) { const t = sel[i]; if (!t.preds.some(p => p.u === sel[i - 1].uid)) t.preds.push({ u: sel[i - 1].uid, t: 'FS', l: 0 }); if (t.dur == null) t.dur = 1; }
  if (sel[0].dur == null) sel[0].dur = 1;
  markDirty(); recalc();
}
function unlinkSel() {
  const sel = selectedTasks(); if (!sel.length) return; snap();
  const ids = new Set(sel.map(t => t.uid));
  if (sel.length === 1) sel[0].preds = [];
  else sel.forEach(t => { t.preds = t.preds.filter(p => !ids.has(p.u)); });
  markDirty(); recalc();
}
function setPct(p) {
  const sel = selectedTasks().filter(t => !t._sum); if (!sel.length) return; snap();
  sel.forEach(t => { t.avance = p / 100; }); markDirty(); recalc();
}
function setBaseline() {
  if (S.tasks.some(t => t.bls) && !confirm('¿Sobrescribir la línea base existente?')) return;
  snap();
  S.tasks.forEach(t => { if (t.start) { t.bls = t.start; t.blf = t.finish; t.bld = t.dur; } else { t.bls = t.blf = ''; t.bld = ''; } });
  S.showBase = true; LS.set('po_base', true); markDirty(); recalc(); toast('Línea base guardada');
}

/* ---------- edición en celda ---------- */
function startEdit(uid, k) {
  if (!canEdit()) return;
  const t = S.byUid.get(uid); if (!t) return;
  const col = COLS.find(c => c.k === k); if (!col || !col.f) return;
  if (t._sum && col.f !== 'nombre') return;
  const cell = $(`#lbody .row[data-u="${uid}"] .c[data-k="${k}"]`); if (!cell) return;
  let val = '';
  switch (col.f) {
    case 'dur': val = t.dur ?? ''; break;
    case 'start': case 'finish': val = t[col.f] || ''; break;
    case 'preds': val = predsText(t.preds); break;
    case 'avance': val = Math.round((+t.avance || 0) * 100); break;
    default: val = t[col.f] ?? '';
  }
  const type = (col.f === 'start' || col.f === 'finish') ? 'date' : col.f === 'avance' ? 'number' : 'text';
  const list = col.f === 'sub' ? ' list="dlSubs"' : '';
  cell.innerHTML = `<input type="${type}" value="${esc(val)}"${list}${type === 'number' ? ' min="0" max="100"' : ''}>`;
  if (col.f === 'sub') { let dl = $('#dlSubs'); if (!dl) { dl = document.createElement('datalist'); dl.id = 'dlSubs'; document.body.appendChild(dl); } dl.innerHTML = [...new Set(S.tasks.map(x => x.sub).filter(Boolean))].map(s => `<option value="${esc(s)}">`).join(''); }
  const inp = cell.querySelector('input'); inp.focus(); if (inp.select) inp.select();
  let done = false;
  const commit = (move) => {
    if (done) return; done = true;
    const nv = inp.value;
    if (String(nv) !== String(val)) {
      snap();
      if (setField(t, col.f, nv)) { markDirty(); recalc(); } else { S.undo.pop(); renderGrid(); }
    } else renderGrid();
    if (move) {
      const i = S.vis.findIndex(x => x.uid === uid);
      if (move === 'down' && S.vis[i + 1]) { S.sel = new Set([S.vis[i + 1].uid]); S.anchor = S.vis[i + 1].uid; syncSel(); }
      if (move === 'right') { const ci = COLS.findIndex(c => c.k === k); const nx = COLS.slice(ci + 1).find(c => c.f); if (nx) startEdit(uid, nx.k); }
    }
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit('down'); }
    else if (e.key === 'Tab') { e.preventDefault(); commit('right'); }
    else if (e.key === 'Escape') { done = true; renderGrid(); }
    e.stopPropagation();
  });
  inp.addEventListener('blur', () => commit());
}

/* ---------- selección ---------- */
function syncSel() {
  $$('#lbody .row').forEach(r => r.classList.toggle('sel', S.sel.has(+r.dataset.u)));
  $$('#gbody .grow').forEach(r => r.classList.toggle('sel', S.sel.has(+r.dataset.u)));
  if ($('#drawer').classList.contains('open')) renderDrawer();
}
function clickRow(uid, e) {
  if (e.shiftKey && S.anchor != null) {
    const a = S.vis.findIndex(t => t.uid === S.anchor), b = S.vis.findIndex(t => t.uid === uid);
    S.sel = new Set(S.vis.slice(Math.min(a, b), Math.max(a, b) + 1).map(t => t.uid));
  } else if (e.ctrlKey || e.metaKey) { S.sel.has(uid) ? S.sel.delete(uid) : S.sel.add(uid); S.anchor = uid; }
  else { S.sel = new Set([uid]); S.anchor = uid; }
  syncSel();
}

/* =====================================================================

/* =====================================================================
   INTERACCIÓN GANTT (mover, estirar, vincular arrastrando)
   ===================================================================== */
function initGanttEvents() {
  const body = $('#gbody');
  let drag = null;
  body.addEventListener('pointerdown', e => {
    const bar = e.target.closest('.bar'); const row = e.target.closest('.grow');
    if (!bar) { if (row) clickRow(+row.dataset.u, e); return; }
    const uid = +bar.dataset.u, t = S.byUid.get(uid); if (!t) return;
    if (!S.sel.has(uid) || !(e.ctrlKey || e.metaKey)) { S.sel = new Set([uid]); S.anchor = uid; syncSel(); }
    if (t._sum || !canEdit()) return;
    const mode = e.target.classList.contains('lk') ? 'link' : e.target.classList.contains('rs') ? 'resize' : 'move';
    if (+t.dur === 0 && mode === 'resize') return;
    drag = { mode, t, bar, x0: e.clientX, left: parseFloat(bar.style.left), width: parseFloat(bar.style.width) || 13, moved: false };
    bar.setPointerCapture(e.pointerId); e.preventDefault();
  });
  body.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = (e.clientX - drag.x0) / uiZ(); if (Math.abs(dx) > 3) drag.moved = true;
    if (drag.mode === 'move') drag.bar.style.left = (drag.left + dx) + 'px';
    else if (drag.mode === 'resize') drag.bar.style.width = Math.max(G.ppd, drag.width + dx) + 'px';
    else {
      const r = body.getBoundingClientRect();
      const x1 = drag.left + drag.width, y1 = parseFloat(drag.bar.style.top) + 7;
      $('#tmpLink').innerHTML = `<path d="M${x1},${y1}L${(e.clientX - r.left) / uiZ()},${(e.clientY - r.top) / uiZ()}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>`;
    }
  });
  const end = e => {
    if (!drag) return; const d = drag; drag = null;
    if (d.mode === 'link') {
      $('#tmpLink').innerHTML = '';
      d.bar.style.pointerEvents = 'none';
      const el = document.elementFromPoint(e.clientX, e.clientY); d.bar.style.pointerEvents = '';
      const tb = el && el.closest('.bar'); const tr = el && el.closest('.grow');
      const target = S.byUid.get(+(tb?.dataset.u || tr?.dataset.u));
      if (target && target !== d.t && !target._sum) {
        snap(); if (!target.preds.some(p => p.u === d.t.uid)) target.preds.push({ u: d.t.uid, t: 'FS', l: 0 });
        if (target.dur == null) target.dur = 1; markDirty(); recalc(); toast(`Vínculo ${d.t.uid} → ${target.uid} (FC)`);
      }
      return;
    }
    if (!d.moved) return;
    const days = Math.round((e.clientX - d.x0) / uiZ() / G.ppd);
    if (!days) { renderGantt(); return; }
    snap();
    if (d.mode === 'move') { const ns = Cal.ci(dn(d.t.start) + days); d.t.ct = d.t.ct === 'MSO' ? 'MSO' : 'SNET'; d.t.cd = Cal.iso(ns); }
    else { const nf = Cal.fi(dn(d.t.finish) + days); d.t.dur = Math.max(1, nf - d.t._ES + 1); }
    markDirty(); recalc();
  };
  body.addEventListener('pointerup', end); body.addEventListener('pointercancel', end);
  body.addEventListener('dblclick', e => { const b = e.target.closest('.bar,.grow'); if (b) { S.sel = new Set([+b.dataset.u]); syncSel(); openDrawer(); } });
}
function initGridEvents() {
  const lb = $('#lbody');
  lb.addEventListener('click', e => {
    const tg = e.target.closest('[data-tg]');
    if (tg) { const u = +tg.dataset.tg; S.collapsed.has(u) ? S.collapsed.delete(u) : S.collapsed.add(u); renderAll(); return; }
    const row = e.target.closest('.row'); if (!row || e.target.closest('input')) return;
    clickRow(+row.dataset.u, e);
  });
  lb.addEventListener('dblclick', e => {
    const c = e.target.closest('.c'); const row = e.target.closest('.row'); if (!c || !row) return;
    if (c.dataset.k === 'id' || c.dataset.k === 'ind') { S.sel = new Set([+row.dataset.u]); syncSel(); openDrawer(); return; }
    startEdit(+row.dataset.u, c.dataset.k);

  // scroll sincronizado
  const L = $('#lwrap'), R = $('#gwrap'); let lock = false;
  L.addEventListener('scroll', () => { if (lock) { lock = false; return; } if (R.scrollTop !== L.scrollTop) { lock = true; R.scrollTop = L.scrollTop; } });
  R.addEventListener('scroll', () => { if (lock) { lock = false; return; } if (L.scrollTop !== R.scrollTop) { lock = true; L.scrollTop = R.scrollTop; } });
  // splitter

/* =====================================================================
   VISTAS SECUNDARIAS
   ===================================================================== */
function renderView() {
  const v = $('#view');

  else if (S.view === 'subs') v.innerHTML = viewSubs();
  else if (S.view === 'avance') v.innerHTML = viewAvance();
  else if (S.view === 'cal') v.innerHTML = viewCal();
}
function leavesVisible() { const vis = new Set(S.vis); return S.tasks.filter(t => !t._sum && t.start && (S.filterActive ? vis.has(t) : true)); }
function lookData() {
  const weeks = +LS.get('po_lw_weeks', 3), group = LS.get('po_lw_group', 'sub');
  const C = dn(S.project.fecha_corte || todayIso()); const mon = C - (dowOf(C) + 6) % 7; const end = mon + weeks * 7 - 1;
  const rows = leavesVisible().filter(t => (+t.avance || 0) < 1 && dn(t.start) <= end && (dn(t.finish) >= mon || t._late));
  const key = t => group === 'piso' ? 'Piso ' + (t.piso ?? '') : (t.sub || 'Sin subcontrato');
  const groups = {};
  rows.sort((a, b) => a.start.localeCompare(b.start) || (+a.piso - +b.piso)).forEach(t => { (groups[key(t)] = groups[key(t)] || []).push(t); });
  return { weeks, group, mon, end, groups, rows };
}

    <select class="inp" onchange="LS.set('po_lw_group',this.value);renderView()"><option value="sub" ${group === 'sub' ? 'selected' : ''}>Agrupar por subcontrato</option><option value="piso" ${group === 'piso' ? 'selected' : ''}>Agrupar por piso</option></select>

  <div class="card"><h3>${esc(S.project.nombre)} — Programa ${weeks} semanas (corte ${fmtL(S.project.fecha_corte || todayIso())}) · ${rows.length} actividades</h3>

      h += `<tr><td>${t.uid}</td><td>${esc(t.piso)}</td><td>${t._crit ? '<b style="color:var(--crit)">● </b>' : ''}${esc(t.nombre)}${group === 'piso' && t.sub ? ' <span class="muted">· ' + esc(t.sub) + '</span>' : ''}</td><td>${fmt(t.start)}</td><td>${fmt(t.finish)}</td><td>${pct(t.avance)}</td><td>${pct(t._prog)}</td>

function copyLookText() {

  Object.keys(groups).sort().forEach(k => {
    s += `\n*${k}*\n` + groups[k].map(t => `• ${t.piso !== '' && t.piso != null ? 'P' + t.piso + ' ' : ''}${t.nombre} (${fmt(t.start)} → ${fmt(t.finish)})${t._late ? ' ⚠️ ' + t._est : ''}`).join('\n') + '\n';

function viewSubs() {
  const L = leavesVisible(); const by = {};
  L.forEach(t => { (by[t.sub || 'Sin subcontrato'] = by[t.sub || 'Sin subcontrato'] || []).push(t); });
  const s0 = dn(S.stats.start), s1 = dn(S.stats.finish); const mon0 = s0 - (dowOf(s0) + 6) % 7;
  const weeks = []; for (let d = mon0; d <= s1; d += 7) weeks.push(d);
  const C = dn(S.project.fecha_corte || todayIso());
  let max = 1; const load = {};

  Object.keys(by).sort().forEach(k => {
    const arr = by[k]; let w = 0, a = 0, p = 0; arr.forEach(t => { const kw = Math.max(1, t._EF - t._ES); w += kw; a += kw * (+t.avance || 0); p += kw * t._prog; });
    const dv = (a - p) / w;
    h += `<tr><td><a href="#" onclick="$('#fSub').value='${esc(k)}';switchView('gantt');return false"><b>${esc(k)}</b></a></td><td>${arr.length}</td><td>${fmt(arr.map(t => t.start).sort()[0])}</td><td>${fmt(arr.map(t => t.finish).sort().pop())}</td><td>${pct(a / w)}</td><td>${pct(p / w)}</td>
      <td class="${dv < -0.02 ? 'neg' : ''}">${dv > 0 ? '+' : ''}${Math.round(dv * 100)}%</td><td class="${arr.some(t => t._late) ? 'neg' : ''}">${arr.filter(t => t._late).length}</td><td>${arr.filter(t => t._crit).length}</td></tr>`;
  });
  h += `</table></div></div><div class="card"><h3>Carga semanal — frentes activos por subcontrato</h3><div style="overflow:auto"><table class="t"><tr><th>Subcontrato</th>${weeks.map(w => `<th style="text-align:center;padding:4px 2px;${w <= C && C < w + 7 ? 'color:var(--corte)' : ''}">${isoOf(w).slice(8)}/${isoOf(w).slice(5, 7)}</th>`).join('')}</tr>`;
  Object.keys(load).sort().forEach(k => {
    h += `<tr><td><b>${esc(k)}</b></td>${load[k].map(n => `<td style="padding:3px 2px;text-align:center"><span class="heat" style="background:${n ? `color-mix(in srgb, var(--bar) ${Math.round(15 + 85 * n / max)}%, transparent)` : 'transparent'};color:${n / max > .55 ? '#fff' : 'inherit'}">${n || ''}</span></td>`).join('')}</tr>`;

function curve(useBase) {

  if (!L.length) return null;
  const items = L.map(t => { const s = Cal.ci(dn(useBase ? t.bls : t.start)), e = Cal.fi(dn(useBase ? t.blf : t.finish)) + 1; return { s, e, w: Math.max(1, e - s) }; });

}
function viewAvance() {

    <div class="kpi"><div class="v">${pct(s.prog)}</div><div class="l">Programado al corte</div></div>

const Store = {
  remote() { return !!(S.cfg.apiUrl && S.cfg.token); },
  async call(action, payload = {}) {
    const r = await fetch(S.cfg.apiUrl, { method: 'POST', body: JSON.stringify(Object.assign({ token: S.cfg.token, action }, payload)) });
    const j = await r.json();
    if (!j.ok && !j.conflict) { const e = new Error(j.error || 'Error del servidor'); e.auth = !!j.auth; throw e; }
    return j;
  },
  async listProjects() { if (this.remote()) return (await this.call('listProjects')).projects; return LS.get('po_projects', []); },
  async getProject(id) {
    if (this.remote()) { const j = await this.call('getProject', { id }); return { project: j.project, tasks: j.tasks.map(rowToTask), feriados: j.feriados }; }
    const project = LS.get('po_projects', []).find(p => p.id === id); if (!project) throw new Error('Proyecto no encontrado');
    return { project, tasks: LS.get('po_t_' + id, []).map(rowToTask), feriados: LS.get('po_feriados', DEFAULT_FERIADOS) };
  },
  async saveProject(project, tasks, baseVersion, force) {
    const rows = tasks.map(taskToRow);
    if (this.remote()) return this.call('saveProject', { project, tasks: rows, baseVersion, force, resumen: S.stats.n + ' tareas, avance ' + pct(S.stats.real) });
    const ps = LS.get('po_projects', []); const i = ps.findIndex(p => p.id === project.id);
    const meta = Object.assign({}, project, { version: (project.version || 0) + 1, actualizado: new Date().toISOString(), nTareas: tasks.length });
    if (i >= 0) ps[i] = meta; else ps.push(meta);
    if (!LS.set('po_t_' + project.id, rows) || !LS.set('po_projects', ps)) throw new Error('Sin espacio en el navegador');
    return { version: meta.version };
  },
  async deleteProject(id) {
    if (this.remote()) return this.call('deleteProject', { id });
    LS.set('po_projects', LS.get('po_projects', []).filter(p => p.id !== id)); LS.del('po_t_' + id);
  },
  async saveFeriados(list) { if (this.remote()) return this.call('saveFeriados', { feriados: list }); LS.set('po_feriados', list); },
};
function taskToRow(t) {
  return {
    uid: t.uid, nivel: t.nivel, nombre: t.nombre, piso: t.piso ?? '', subcontrato: t.sub || '', duracion: t.dur ?? '',
    inicio: t.start || '', fin: t.finish || '', avance: +t.avance || 0, predecesoras: predsText(t.preds), restriccion: t.ct || 'ASAP',
    fecha_restriccion: t.cd || '', lb_inicio: t.bls || '', lb_fin: t.blf || '', lb_duracion: t.bld ?? '', notas: t.notas || '',
    hito: +t.dur === 0 && !t._sum, resumen: !!t._sum, critica: !!t._crit, holgura: t._TF ?? '',
  };
}
function rowToTask(r) {
  const dv = r.duracion ?? r.dur;
  return {
    uid: +r.uid, nivel: +r.nivel || 1, nombre: String(r.nombre ?? ''), piso: r.piso ?? '', sub: r.subcontrato || r.sub || '',
    dur: dv === '' || dv == null ? null : +dv,
    avance: +r.avance || 0, preds: Array.isArray(r.preds) ? r.preds : parsePreds(r.predecesoras).preds, ct: r.restriccion || r.ct || 'ASAP',
    cd: anyToIso(r.fecha_restriccion || r.cd), bls: anyToIso(r.lb_inicio || r.bls), blf: anyToIso(r.lb_fin || r.blf), bld: r.lb_duracion ?? r.bld ?? '',
    notas: r.notas || '', start: anyToIso(r.inicio || r.start), finish: anyToIso(r.fin || r.finish),
  };
}
async function loadProjects(selectId) {
  try { S.projects = await Store.listProjects(); } catch (e) { toast('No se pudo conectar: ' + e.message, 5000); S.projects = []; }
  fillProjSel();
  const id = selectId || LS.get('po_last', null);
  const p = S.projects.find(x => x.id === id) || S.projects[0];
  if (p) await openProject(p.id); else { S.project = null; renderAll(); }
}
function fillProjSel() {
  $('#projSel').innerHTML = S.projects.length ? S.projects.map(p => `<option value="${esc(p.id)}" ${S.project && p.id === S.project.id ? 'selected' : ''}>${esc(S.project && p.id === S.project.id ? S.project.nombre : p.nombre)}</option>`).join('') : '<option>— sin proyectos —</option>';
}
async function openProject(id) {
  if (S.dirty && !confirm('Hay cambios sin guardar. ¿Descartarlos?')) { fillProjSel(); return; }
  try {
    const d = await Store.getProject(id);
    S.project = d.project; S.project.config = S.project.config || {}; S.tasks = d.tasks; S.feriados = d.feriados || [];
    S.undo = []; S.redo = []; S.sel.clear(); S.collapsed = new Set(LS.get('po_col_' + id, []));
    S.dirty = false; LS.set('po_last', id); recalc(); fillProjSel(); setTimeout(scrollToToday, 50);
  } catch (e) { toast('Error al abrir: ' + e.message, 5000); }
}
async function saveProject(silent, force) {
  if (!S.project || !canEdit()) return;
  const btn = $('#btnSave'); btn.disabled = true; if (!silent) btn.textContent = 'Guardando…';
  try {
    const r = await Store.saveProject(Object.assign({}, S.project), S.tasks, S.project.version ?? null, force);
    if (r.conflict) { conflictModal(r.error); return; }
    S.project.version = r.version; S.dirty = false;
    const i = S.projects.findIndex(p => p.id === S.project.id);
    if (i < 0) S.projects.push(Object.assign({}, S.project)); else S.projects[i] = Object.assign({}, S.projects[i], S.project);
    fillProjSel(); renderSaveState(); if (!silent) toast('Guardado');
  } catch (e) { toast('Error al guardar: ' + e.message, 5000); }
  finally { btn.disabled = false; btn.textContent = 'Guardar'; }
}
function conflictModal(msg) {
  modal('Conflicto de versiones', `<p>${esc(msg)}</p><p class="small muted">Otra persona guardó cambios mientras editabas. Puedes recargar (pierdes tus cambios) o sobrescribir (se pierden los de la otra persona). Recomendado: exportar tu versión a Excel antes.</p>`,
    [['Cancelar', closeModal], ['Recargar', () => { closeModal(); S.dirty = false; openProject(S.project.id); }], ['Sobrescribir', () => { closeModal(); saveProject(false, true); }, 'dan']]);
}

async function createProjectWith(p, tasks, feriados) {
  S.dirty = false;
  S.project = p; S.tasks = tasks; if (feriados) S.feriados = feriados; else if (!S.feriados.length) S.feriados = LS.get('po_feriados', DEFAULT_FERIADOS);
  S.undo = []; S.redo = []; S.sel.clear(); S.collapsed.clear();
  schedule();
  await saveProject(true);
  S.projects = await Store.listProjects(); LS.set('po_last', p.id); fillProjSel(); recalc(); setTimeout(scrollToToday, 50);
}

}

function modal(title, html, buttons) {

  const f = $('#modal footer');
  (buttons || [['Cerrar', closeModal]]).forEach(([l, fn, cls]) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = l; b.onclick = fn; f.appendChild(b); });
  $('#modalBg').classList.add('open');
}
function closeModal() { $('#modalBg').classList.remove('open'); $('#modal').style.width = ''; }

  L.forEach(t => { const s = dn(t.start), e = dn(t.finish); g.push([t.uid, t.piso, t.nombre, t.sub, +t.avance || 0, serial(t.start), serial(t.finish), t.start ? t.dur : ''].concat(weeks.map(w => (s != null && s <= w + 6 && e >= w) ? 1 : null))); });

  for (let r = 3; r < g.length; r++) { [5, 6].forEach(c => { const a = XLSX.utils.encode_cell({ r, c }); if (ws2[a] && ws2[a].t === 'n') ws2[a].z = 'dd-mm-yyyy'; }); const a = XLSX.utils.encode_cell({ r, c: 4 }); if (ws2[a]) ws2[a].z = '0%'; }

}
function exportMSPDI() {
  const X = s => esc(s);
  const dt = (s, h) => s + 'T' + h;
  const durH = d => 'PT' + (Math.max(0, +d || 0) * 8) + 'H0M0S';
  const CTN = { ASAP: 0, MSO: 2, MFO: 3, SNET: 4, SNLT: 5, FNET: 6, FNLT: 7 }, LTN = { FF: 0, FS: 1, SF: 2, SS: 3 };
  const sat = !!S.project.config?.sat;
  const wt = '<WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime><WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>';
  const wd = [1, 2, 3, 4, 5, 6, 7].map(d => { const work = (d >= 2 && d <= 6) || (d === 7 && sat); return `<WeekDay><DayType>${d}</DayType><DayWorking>${work ? 1 : 0}</DayWorking>${work ? wt : ''}</WeekDay>`; }).join('');
  const ex = S.feriados.map(f => `<WeekDay><DayType>0</DayType><DayWorking>0</DayWorking><TimePeriod><FromDate>${f.fecha}T00:00:00</FromDate><ToDate>${f.fecha}T23:59:00</ToDate></TimePeriod></WeekDay>`).join('');
  const subs = [...new Set(S.tasks.filter(t => !t._sum && t.sub).map(t => t.sub))];
  const rUid = Object.fromEntries(subs.map((s, i) => [s, i + 1]));
  let tasksXml = '', asg = '', au = 1;
  S.tasks.forEach((t, i) => {
    const ms = !t._sum && +t.dur === 0;
    tasksXml += `<Task><UID>${t.uid}</UID><ID>${i + 1}</ID><Name>${X(t.nombre)}</Name><Active>1</Active><Manual>0</Manual><Type>1</Type><IsNull>0</IsNull><WBS>${t._wbs}</WBS><OutlineNumber>${t._wbs}</OutlineNumber><OutlineLevel>${t.nivel}</OutlineLevel>` +
      (t.start ? `<Start>${dt(t.start, '08:00:00')}</Start><Finish>${dt(t.finish, ms ? '08:00:00' : '17:00:00')}</Finish>` : '') +
      `<Duration>${durH(t.dur)}</Duration><DurationFormat>7</DurationFormat><Milestone>${ms ? 1 : 0}</Milestone><Summary>${t._sum ? 1 : 0}</Summary><EffortDriven>0</EffortDriven><Estimated>${t.dur == null ? 1 : 0}</Estimated><PercentComplete>${Math.round((+t.avance || 0) * 100)}</PercentComplete>` +
      `<ConstraintType>${CTN[t.ct] || 0}</ConstraintType>${t.cd && t.ct !== 'ASAP' ? `<ConstraintDate>${dt(t.cd, t.ct === 'FNET' || t.ct === 'FNLT' || t.ct === 'MFO' ? '17:00:00' : '08:00:00')}</ConstraintDate>` : ''}` +
      (t.notas ? `<Notes>${X(t.notas)}</Notes>` : '') +
      (t._sum ? '' : (t.preds || []).map(p => `<PredecessorLink><PredecessorUID>${p.u}</PredecessorUID><Type>${LTN[p.t]}</Type><CrossProject>0</CrossProject><LinkLag>${(p.l || 0) * 4800}</LinkLag><LagFormat>7</LagFormat></PredecessorLink>`).join('')) +
      (t.bls ? `<Baseline><Number>0</Number><Start>${dt(t.bls, '08:00:00')}</Start><Finish>${dt(t.blf, '17:00:00')}</Finish><Duration>${durH(t.bld)}</Duration></Baseline>` : '') +
      `<ExtendedAttribute><FieldID>188743731</FieldID><Value>${X(t.piso ?? '')}</Value></ExtendedAttribute></Task>`;
    if (!t._sum && t.sub && rUid[t.sub]) asg += `<Assignment><UID>${au++}</UID><TaskUID>${t.uid}</TaskUID><ResourceUID>${rUid[t.sub]}</ResourceUID><Units>1</Units></Assignment>`;
  });
  const xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Project xmlns="http://schemas.microsoft.com/project"><Name>${X(S.project.nombre)}.xml</Name><Title>${X(S.project.nombre)}</Title><ScheduleFromStart>1</ScheduleFromStart>
<StartDate>${dt(S.project.inicio || S.stats.start, '08:00:00')}</StartDate>${S.project.fecha_corte ? `<StatusDate>${dt(S.project.fecha_corte, '17:00:00')}</StatusDate>` : ''}
<CalendarUID>1</CalendarUID><DefaultStartTime>08:00:00</DefaultStartTime><DefaultFinishTime>17:00:00</DefaultFinishTime><MinutesPerDay>480</MinutesPerDay><MinutesPerWeek>${sat ? 2880 : 2400}</MinutesPerWeek><DaysPerMonth>20</DaysPerMonth><DurationFormat>7</DurationFormat><NewTasksEffortDriven>0</NewTasksEffortDriven>
<ExtendedAttributes><ExtendedAttribute><FieldID>188743731</FieldID><FieldName>Text1</FieldName><Alias>Piso</Alias></ExtendedAttribute></ExtendedAttributes>
<Calendars><Calendar><UID>1</UID><Name>Estándar Chile</Name><IsBaseCalendar>1</IsBaseCalendar><WeekDays>${wd}${ex}</WeekDays></Calendar></Calendars>
<Tasks>${tasksXml}</Tasks>
<Resources>${subs.map((s, i) => `<Resource><UID>${i + 1}</UID><ID>${i + 1}</ID><Name>${X(s)}</Name><Type>1</Type><MaxUnits>1.00</MaxUnits></Resource>`).join('')}</Resources>
<Assignments>${asg}</Assignments></Project>`;
  download(safeName(S.project.nombre) + '.xml', xml, 'application/xml');
}

function bind() {
  $('#btnSave').onclick = () => saveProject();
  $('#btnCfg').onclick = openCfg;
  $('#btnUsers').onclick = openUsers;
  $('#btnImport').onclick = openImport;
  $('#btnExport').onclick = exportMenu;
  $('#btnNewProj').onclick = newProject;
  $('#btnProjMenu').onclick = projMenu;
  $('#fileIn').onchange = e => { if (e.target.files[0]) onFile(e.target.files[0]); };
  $('#projSel').onchange = e => openProject(e.target.value);
  $('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
  $('#bAdd').onclick = () => newTask(false); $('#bMs').onclick = () => newTask(true); $('#bDel').onclick = deleteSel;
  $('#bIn').onclick = () => indent(1); $('#bOut').onclick = () => indent(-1);
  $('#bUp').onclick = () => moveSel(-1); $('#bDown').onclick = () => moveSel(1);
  $('#bLink').onclick = linkSel; $('#bUnlink').onclick = unlinkSel; $('#bInfo').onclick = openDrawer;
  $$('[data-pct]').forEach(b => b.onclick = () => setPct(+b.dataset.pct));
  const zs = ['dia', 'semana', 'mes', 'trim'];
  const setZoom = (z, ppd) => {
    const c = $('#gwrap'); const mid = (c.scrollLeft + c.clientWidth / 2) / G.ppd + G.t0;
    S.zoom = z; if (ppd) S.ppdC = ppd; LS.set('po_zoom', z); LS.set('po_ppdc', S.ppdC || 8); $('#zoomSel').value = z;
    renderAll(); c.scrollLeft = z === 'fit' ? 0 : (mid - G.t0) * G.ppd - c.clientWidth / 2;
  };
  window.setZoom = setZoom;
  // Ctrl + rueda: sobre el Gantt cambia la escala de tiempo; sobre la tabla/vistas cambia el tamaño
  $('#gwrap').addEventListener('wheel', e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); setZoom('custom', clamp(G.ppd * (e.deltaY < 0 ? 1.2 : 1 / 1.2), 0.25, 40)); }, { passive: false });
  ['#lwrap', '#view'].forEach(sel => $(sel).addEventListener('wheel', e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); setUi(uiZ() + (e.deltaY < 0 ? 0.1 : -0.1)); }, { passive: false }));
  $('#bUiIn').onclick = () => setUi(uiZ() + 0.1); $('#bUiOut').onclick = () => setUi(uiZ() - 0.1); $('#bUiReset').onclick = () => setUi(1);
  window.addEventListener('resize', () => { if (S.zoom === 'fit' && S.view === 'gantt' && S.project) renderGantt(); });
  $('#zoomSel').value = S.zoom; $('#zoomSel').onchange = e => setZoom(e.target.value);
  // +/− pasan al nivel fijo más cercano en esa dirección
  $('#bZoomIn').onclick = () => { const nx = zs.slice().reverse().find(z => ZOOM[z] > G.ppd * 1.05); setZoom(nx || 'dia'); };
  $('#bZoomOut').onclick = () => { const nx = zs.find(z => ZOOM[z] < G.ppd / 1.05); setZoom(nx || 'trim'); };
  $('#bToday').onclick = scrollToToday;
  $('#bCrit').onclick = () => { S.showCrit = !S.showCrit; renderAll(); };
  $('#bBase').onclick = () => { if (!S.tasks.some(t => t.bls)) { if (confirm('No hay línea base. ¿Guardar la línea base ahora con el programa actual?')) setBaseline(); return; } S.showBase = !S.showBase; LS.set('po_base', S.showBase); renderAll(); };
  let ft; $('#fText').oninput = () => { clearTimeout(ft); ft = setTimeout(renderAll, 200); };
  ['#fPiso', '#fSub', '#fEst'].forEach(s => $(s).onchange = renderAll);
  $$('.tab').forEach(b => b.onclick = () => switchView(b.dataset.v));
  $('#modalBg').addEventListener('pointerdown', e => { if (e.target.id === 'modalBg') closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select')) { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveProject(); } return; }
    if ($('#modalBg').classList.contains('open')) return;
    const k = e.key, c = e.ctrlKey || e.metaKey;
    if (c && k === 's') { e.preventDefault(); saveProject(); }

      if (n) { S.sel = new Set([n.uid]); S.anchor = n.uid; syncSel(); const r = $(`#lbody .row[data-u="${n.uid}"]`); r && r.scrollIntoView({ block: 'nearest' }); }
    }
  });

  setInterval(() => { if (S.project) LS.set('po_col_' + S.project.id, [...S.collapsed]); }, 3000);
